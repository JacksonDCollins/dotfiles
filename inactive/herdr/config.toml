# Inactive draft based on Omarchy Quattro's Herdr config.
# Move to linux/herdr/.config/herdr/config.toml to include it in installs.
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[session]
# Match our Resurrect behavior: restore layout/history, not agent processes.
resume_agents_on_restore = false

[keys]
prefix = "ctrl+a"

# Config and help
reload_config = "prefix+shift+r"
help = "prefix+?"
detach = "prefix+d"

# TSM-like workspace navigation. Workspace numbers are positional rather than marked.
workspace_picker = ["prefix+w", "ctrl+shift+minus"]
switch_workspace = "ctrl+shift+1..9"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+minus", "alt+enter"]
split_vertical = ["prefix+backslash", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = ["prefix+semicolon", "prefix+shift+6", "ctrl+backslash"]

# Herdr cannot conditionally hand these keys to Neovim at split boundaries.
focus_pane_left = "ctrl+left"
focus_pane_down = "ctrl+down"
focus_pane_up = "ctrl+up"
focus_pane_right = "ctrl+right"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; prefix+shift+p is taken by previous workspace
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "ctrl+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+q"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[[keys.command]]
key = "ctrl+shift+period"
type = "popup"
command = 'dir=$(zoxide query -i) && [ -n "$dir" ] && "$HERDR_BIN_PATH" workspace create --cwd "$dir" --label "$(basename "$dir")" --focus >/dev/null'
description = "Open project workspace"
width = "80%"
height = "80%"

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

[experimental]
# Equivalent to @resurrect-capture-pane-contents without restarting commands.
pane_history = true
