[main]
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9
pad=0x0
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Preserve distinct Shift+Return and Alt+Shift+Return sequences for TUIs/tmux.
\x1b[13;2u=Shift+Return
\x1b[13;4u=Mod1+Shift+Return
# TSM session selection and mark shortcuts.
\xee\x80\x81=Control+Shift+1
\xee\x80\x82=Control+Shift+2
\xee\x80\x83=Control+Shift+3
\xee\x80\x84=Control+Shift+4
\xee\x80\x85=Control+Shift+5
\xee\x80\x86=Control+Shift+6
\xee\x80\x87=Control+Shift+7
\xee\x80\x88=Control+Shift+8
\xee\x80\x89=Control+Shift+9
\xee\x80\x90=Control+Shift+period
\xee\x80\x91=Control+Shift+0
\xee\x80\x92=Control+Shift+minus
