# Reset server options so config reloads cannot accumulate duplicate capabilities.
set-option -su terminal-features
set-option -sa terminal-features 'xterm-kitty:extkeys'
set-option -sa terminal-features ',*:clipboard'
set-option -sa terminal-features ',*:RGB'
set-option -su terminal-overrides
set-option -sa terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'

# Core terminal behavior
set-option -g default-terminal "tmux-256color"
set -s escape-time 0
set-option -g extended-keys on
set-option -g extended-keys-format csi-u
set-option -g set-clipboard on
set-option -g allow-passthrough on
set-option -g mouse on

# Set prefix to Ctrl-a
unbind -q C-b
set-option -g prefix C-a
set-option -g prefix2 None
bind-key -N "Send prefix" C-a send-prefix

# Config and help
bind -N "Reload configuration" R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
bind -N "Show keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "tmux list-keys -aN | less -RS"

set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set-option -g history-limit 50000
set-option -g display-time 4000
set-window-option -g aggressive-resize on
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{?#{||:#{==:#{pane_current_command},opencode},#{==:#{pane_current_command},pi}},#{pane_title},#{pane_current_command}}'
set-option -g set-titles on
set-option -g set-titles-string '#h:#W'
set-option -g pane-border-style 'fg=brightblack'
set-option -g pane-active-border-style 'fg=blue'
set-option -g message-style 'bg=default,fg=blue'
set-option -g message-command-style 'bg=default,fg=blue'
set-option -g mode-style 'bg=blue,fg=black'

# Enable vi mode for copy mode (matches Neovim)
set-window-option -g mode-keys vi

# Vi-style selection and yanking
bind -N "Begin selection" -T copy-mode-vi v send-keys -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Half-page scrolling in copy mode
bind -N "Scroll up half a page" -T copy-mode-vi C-PageUp send-keys -X halfpage-up
bind -N "Scroll down half a page" -T copy-mode-vi C-PageDown send-keys -X halfpage-down

# Repeat copy-mode searches without leaving the home row
bind -N "Repeat search" -T copy-mode-vi C-h send-keys -X search-again
bind -N "Repeat search in reverse" -T copy-mode-vi C-l send-keys -X search-reverse

set -g detach-on-destroy on

# Split panes using h and v.
unbind-key -q '"'
unbind-key -q '%'
bind-key -N "Split pane horizontally" h split-window -h -c "#{pane_current_path}"
bind-key -N "Split pane vertically" v split-window -v -c "#{pane_current_path}"

# Keep destructive pane and window actions mnemonic, but require confirmation.
bind-key -N "Kill pane" x confirm-before -p "Kill pane #P? (y/n)" kill-pane
bind-key -N "Kill window" '&' confirm-before -p "Kill window #W? (y/n)" kill-window
bind-key -N "Kill session" q confirm-before -p "Kill session #S? (y/n)" kill-session

# Keep frequent window and session actions on lowercase keys.
unbind-key -q '('
unbind-key -q ')'
bind-key -N "Create window" c new-window -c "#{pane_current_path}"
bind-key -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind-key -N "Create session" C new-session -c "#{pane_current_path}"
bind-key -N "Last window" l last-window
bind-key -N "Move window to index" . command-prompt -N -p "Move window to index:" {
    if-shell -F "#{==:#{window_index},%1}" {
        display-message "Window is already at index %1"
    } {
        if-shell -F "#{<:#{window_index},%1}" {
            move-window -a -t ":%1"
            move-window -r
        } {
            move-window -b -t ":%1"
            move-window -r
        }
    }
}
bind-key -r -N "Next session" j switch-client -n
bind-key -r -N "Previous session" k switch-client -p

bind -n -N "Forward Ctrl-. to pane" C-. send-keys "\e[46;5u"

vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

# Prefix-free pane controls
bind-key -n -N "Focus pane left" 'C-Left' if-shell "$is_vim" 'send-keys C-Left' 'select-pane -L'
bind-key -n -N "Focus pane down" 'C-Down' if-shell "$is_vim" 'send-keys C-Down' 'select-pane -D'
bind-key -n -N "Focus pane up" 'C-Up' if-shell "$is_vim" 'send-keys C-Up' 'select-pane -U'
bind-key -n -N "Focus pane right" 'C-Right' if-shell "$is_vim" 'send-keys C-Right' 'select-pane -R'
bind-key -n -N "Focus last pane" C-\\ if-shell "$is_vim" "send-keys C-\\\\" "select-pane -l"

bind-key -rn -N "Resize pane left" C-S-Left resize-pane -L 5
bind-key -rn -N "Resize pane down" C-S-Down resize-pane -D 5
bind-key -rn -N "Resize pane up" C-S-Up resize-pane -U 5
bind-key -rn -N "Resize pane right" C-S-Right resize-pane -R 5
bind-key -rn -N "Move pane left" M-S-Left if-shell -F '#{!=:#{pane_at_left},1}' 'swap-pane -d -t "{left-of}"'
bind-key -rn -N "Move pane down" M-S-Down if-shell -F '#{!=:#{pane_at_bottom},1}' 'swap-pane -d -t "{down-of}"'
bind-key -rn -N "Move pane up" M-S-Up if-shell -F '#{!=:#{pane_at_top},1}' 'swap-pane -d -t "{up-of}"'
bind-key -rn -N "Move pane right" M-S-Right if-shell -F '#{!=:#{pane_at_right},1}' 'swap-pane -d -t "{right-of}"'

bind-key -N "Focus pane left" -T copy-mode-vi 'C-Left' select-pane -L
bind-key -N "Focus pane down" -T copy-mode-vi 'C-Down' select-pane -D
bind-key -N "Focus pane up" -T copy-mode-vi 'C-Up' select-pane -U
bind-key -N "Focus pane right" -T copy-mode-vi 'C-Right' select-pane -R
bind-key -N "Focus last pane" -T copy-mode-vi 'C-\' select-pane -l

bind -n -N "Select window 1" C-1 select-window -t 1
bind -n -N "Select window 2" C-2 select-window -t 2
bind -n -N "Select window 3" C-3 select-window -t 3
bind -n -N "Select window 4" C-4 select-window -t 4
bind -n -N "Select window 5" C-5 select-window -t 5
bind -n -N "Select window 6" C-6 select-window -t 6
bind -n -N "Select window 7" C-7 select-window -t 7
bind -n -N "Select window 8" C-8 select-window -t 8
bind -n -N "Select window 9" C-9 select-window -t 9

set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @tmux-dotbar-right "true"
set -g @tmux-dotbar-left "true"

if-shell 'command -v omarchy-theme-color >/dev/null 2>&1 && [ -f ~/.local/state/omarchy/current/theme/colors.toml ]' {
        run-shell 'tmux set -g @tmux-dotbar-bg "$(omarchy-theme-color background)"; \
                tmux set -g @tmux-dotbar-fg "$(omarchy-theme-color muted)"; \
                tmux set -g @tmux-dotbar-fg-current "$(omarchy-theme-color foreground)"; \
                tmux set -g @tmux-dotbar-fg-session "$(omarchy-theme-color accent)"; \
                tmux set -g @tmux-dotbar-fg-prefix "$(omarchy-theme-color accent)"'
} {
        set -g @tmux-dotbar-bg "#1e1e2e";
        set -g @tmux-dotbar-fg "#585b70";
        set -g @tmux-dotbar-fg-current "#cdd6f4";
        set -g @tmux-dotbar-fg-session "#9399b2";
        set -g @tmux-dotbar-fg-prefix "#cba6f7";
}


set -g focus-events on
set -g @tmux-dotbar-status-left ' #[fg=#{@tmux-dotbar-bg},bg=#{@tmux-dotbar-fg-prefix}]#{?client_prefix,#S,}#[bg=#{@tmux-dotbar-bg},fg=#{@tmux-dotbar-fg-session}]#{?client_prefix,,#S}#[bg=#{@tmux-dotbar-bg},fg=#{@tmux-dotbar-fg}] #(cat #{socket_path}-\#{session_id}-vimbridge)'
set -g @tmux-dotbar-status-right '#(cat #{socket_path}-\#{session_id}-vimbridge-R)#[bg=#{@tmux-dotbar-bg},fg=#{@tmux-dotbar-fg}]'
set -g status-left-length 300
set -g status-right-length 3500

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'false'
set -g @resurrect-hook-post-save-layout "bash $HOME/tmux-bins/tmux-session-fixes/save.sh"
set -g @resurrect-hook-post-restore-all "bash $HOME/tmux-bins/tmux-session-fixes/restore.sh"

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'

set -g @t-fzf-default-results 'sessions' # show tmux sessions by default
set -g @t-status-active "#[bg=#{@tmux-dotbar-bg},fg=#{@tmux-dotbar-fg-current}]"
set -g @t-status-inactive "#[bg=#{@tmux-dotbar-bg},fg=#{@tmux-dotbar-fg}]"

# Refresh the status bar every 10 seconds
set -g status-interval 1

# Run TSM before TPM so it can modify @tmux-dotbar-status-right
run '~/tmux-bins/tsm/tsm.tmux'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# Clear bindings left behind when reloading a server that used tmux-sensible.
unbind-key -q a
unbind-key -q C-n
unbind-key -q C-p
