[main]
include=~/.config/theme/foot.ini
term=foot
font=JetBrainsMono Nerd Font:size=9
pad=0x0
initial-window-mode=windowed
workers=0
shell=tmux new-session -A -s main
include=~/.config/foot/machine.ini

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
