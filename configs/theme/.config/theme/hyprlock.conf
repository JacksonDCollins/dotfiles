# Catppuccin Mocha lock-screen appearance; security policy is in hypr/hyprlock.conf.
background {
    monitor =
    color = rgba(1e1e2eff)
}

label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgba(cdd6f4ff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = Session locked
    color = rgba(a6adc8ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    position = 0, -65
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 8
    inner_color = rgba(313244ff)
    outer_color = rgba(cba6f7ff)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(f9e2afff)
    fail_color = rgba(f38ba8ff)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Password
    fail_text = Authentication failed
    fade_on_empty = false
}
