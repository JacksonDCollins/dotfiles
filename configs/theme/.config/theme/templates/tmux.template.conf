# {{name}}, with mauve accents.
set-option -g pane-border-style 'fg={{surface1}}'
set-option -g pane-active-border-style 'fg={{mauve}}'
set-option -g message-style 'bg={{base}},fg={{text}}'
set-option -g message-command-style 'bg={{base}},fg={{mauve}}'
set-option -g mode-style 'bg={{mauve}},fg={{base}}'

set -g @tmux-dotbar-bg "{{base}}"
set -g @tmux-dotbar-fg "{{overlay2}}"
set -g @tmux-dotbar-fg-current "{{text}}"
set -g @tmux-dotbar-fg-session "{{mauve}}"
set -g @tmux-dotbar-fg-prefix "{{mauve}}"
