# {{name}} lock-screen appearance; security policy is in hypr/hyprlock.conf.
background {
    monitor =
    color = rgba({{base.hex}}ff)
}

label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgba({{text.hex}}ff)
    font_size = 64
    font_family = {{font}}
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = Session locked
    color = rgba({{subtext0.hex}}ff)
    font_size = 16
    font_family = {{font}}
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    position = 0, -65
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 8
    inner_color = rgba({{surface0.hex}}ff)
    outer_color = rgba({{mauve.hex}}ff)
    font_color = rgba({{text.hex}}ff)
    check_color = rgba({{yellow.hex}}ff)
    fail_color = rgba({{red.hex}}ff)
    font_family = {{font}}
    placeholder_text = Password
    fail_text = Authentication failed
    fade_on_empty = false
}
