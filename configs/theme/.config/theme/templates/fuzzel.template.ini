# {{name}}, matching the desktop theme.
[main]
font={{font}}:size=11
dpi-aware=no
lines=10
width=42
horizontal-pad=16
vertical-pad=12
inner-pad=8

[colors]
background={{base.hex}}ff
text={{text.hex}}ff
prompt={{mauve.hex}}ff
input={{text.hex}}ff
placeholder={{subtext0.hex}}ff
match={{mauve.hex}}ff
selection={{surface1.hex}}ff
selection-text={{text.hex}}ff
selection-match={{mauve.hex}}ff
counter={{subtext0.hex}}ff
border={{mauve.hex}}ff

[border]
width=1
radius=12
selection-radius=8
