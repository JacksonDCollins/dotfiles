# Catppuccin Mocha, with mauve accents.
set-option -g pane-border-style 'fg=#45475a'
set-option -g pane-active-border-style 'fg=#cba6f7'
set-option -g message-style 'bg=#1e1e2e,fg=#cdd6f4'
set-option -g message-command-style 'bg=#1e1e2e,fg=#cba6f7'
set-option -g mode-style 'bg=#cba6f7,fg=#1e1e2e'

set -g @tmux-dotbar-bg "#1e1e2e"
set -g @tmux-dotbar-fg "#9399b2"
set -g @tmux-dotbar-fg-current "#cdd6f4"
set -g @tmux-dotbar-fg-session "#cba6f7"
set -g @tmux-dotbar-fg-prefix "#cba6f7"
