# Runtime and editor-tool versions live here, never in Neovim configuration.
# Project mise.toml files can override these global defaults.
[vars]
zig_version = "0.16.0" # Zig and ZLS share one compatible release.

[tools]
node = "24.21.0"
python = "3.13.15"
go = "1.27.1"
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "rust-src", "rust-analyzer"] }
zig = "{{ vars.zig_version }}"
dart = "3.13.4" # Includes the Dart language server.
"aqua:tree-sitter/tree-sitter" = "0.26.13"

# Language servers
"github:clangd/clangd" = { version = "23.1.0", asset_pattern = "clangd-linux-*.zip", strip_components = 1, bin_path = "bin" }
"go:golang.org/x/tools/gopls" = "0.23.0"
"npm:typescript" = "6.0.3"
"npm:typescript-language-server" = "6.0.0"
zls = "{{ vars.zig_version }}"
lua-language-server = "3.19.1"

# Formatters and linters (rustfmt comes from the Rust toolchain).
stylua = "2.5.2"
gofumpt = "0.12.0"
"go:golang.org/x/tools/cmd/goimports" = "0.50.0"
shfmt = "3.14.1"
black = "26.5.1"
"npm:@fsouza/prettierd" = "0.29.0"
"npm:markdownlint-cli" = "0.49.1"
ruff = "0.16.8"
shellcheck = "0.11.0"
# Luacheck is supplied by the native package list; mise has no LuaRocks backend.
