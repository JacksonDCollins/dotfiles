# Runtime, CLI, and editor-tool versions live here, never in Neovim configuration.
# Project mise.toml files can override these global defaults.

[tools]
node = "26.11.1"
java = "27.0.0"
python = "3.14.8"
go = "1.27.1"
rust = { version = "1.99.0", profile = "minimal", components = ["rustfmt", "rust-src", "rust-analyzer"] }
zig = "0.17.0"
dart = { version = "3.13.5", checksum_url = "https://storage.googleapis.com/dart-archive/channels/stable/release/{{ version }}/sdk/dartsdk-{{ os() }}-{{ arch() }}-release.zip.sha256sum", url = "https://storage.googleapis.com/dart-archive/channels/stable/release/{{ version }}/sdk/dartsdk-{{ os() }}-{{ arch() }}-release.zip", version_expr = 'fromJSON(body).prefixes | filter({ # matches "^channels/stable/release/(\\d+\\.\\d+\\.\\d+)/$" }) | map({split(#, "/")[3]}) | sortVersions()', version_list_url = "https://storage.googleapis.com/storage/v1/b/dart-archive/o?prefix=channels/stable/release/&delimiter=/" } # Includes the Dart language server.
"aqua:tree-sitter/tree-sitter" = "0.27.0"

# Pi coding agent and its local MCP server executables.
pi = "latest"
"npm:context-mode" = "1.0.169"
"npm:chrome-devtools-mcp" = "1.10.1"

# Predictive Zsh suggestions; shell integration is loaded through Zinit.
"github:Giammarco-Ferranti/deja" = "0.4.2"

# Language servers
"github:clangd/clangd" = { version = "23.1.0", asset_pattern = "clangd-linux-*.zip", strip_components = 1, bin_path = "bin" }
"go:golang.org/x/tools/gopls" = "0.23.0"
"npm:typescript" = "7.0.2"
"npm:typescript-language-server" = "6.0.1"
zls = "0.16.0"
lua-language-server = "3.19.1"

# Formatters and linters (rustfmt comes from the Rust toolchain).
stylua = "2.5.2"
gofumpt = "0.12.0"
"go:golang.org/x/tools/cmd/goimports" = "0.51.0"
shfmt = "3.14.1"
black = "26.10.0"
"npm:@fsouza/prettierd" = "0.29.0"
"npm:markdownlint-cli" = "0.49.1"
ruff = "0.16.10"
shellcheck = "0.11.0"
gh = "latest"
# Luacheck is supplied by the native package list; mise has no LuaRocks backend.
