general {
    lock_cmd = systemctl --user start hyprlock.service
    before_sleep_cmd = systemctl --user start hyprlock.service
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    # Release the sleep delay inhibitor only after compositor lock notification.
    inhibit_sleep = 3
}

# Respect application idle inhibitors. No automatic suspend.
listener {
    timeout = 300
    on-timeout = systemctl --user start hyprlock.service
}

